name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: stable
            name: macos-stable
          - rust: 1.89.0
            name: macos-msrv
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap pinned Rustup in job-local storage
        run: |
          set -euo pipefail
          test "$(uname -sm)" = "Darwin arm64"
          export CARGO_HOME="$RUNNER_TEMP/codex-devices-cargo"
          export RUSTUP_HOME="$RUNNER_TEMP/codex-devices-rustup"
          installer="$RUNNER_TEMP/rustup-init"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --show-error --silent --location --max-time 120 \
            --output "$installer" \
            "https://static.rust-lang.org/rustup/archive/1.29.3/aarch64-apple-darwin/rustup-init"
          printf '%s  %s\n' '63752a1919a3a4793173ec70f8f212621a7ce38ba6a246095984482f4de20f9f' "$installer" | shasum -a 256 -c -
          chmod 700 "$installer"
          "$installer" -y --no-modify-path --profile minimal --default-toolchain none
          "$CARGO_HOME/bin/rustup" set auto-self-update disable
          printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' "$CARGO_HOME" "$RUSTUP_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Install Rust toolchain
        run: >-
          rustup toolchain install '${{ matrix.rust }}' --profile minimal
          --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +${{ matrix.rust }} fmt --check
      - name: Lint all targets
        run: cargo +${{ matrix.rust }} clippy --locked --all-targets -- -D warnings
      - name: Test synthetic workflows
        run: cargo +${{ matrix.rust }} test --locked -- --test-threads=1
      - name: Build release executable
        run: cargo +${{ matrix.rust }} build --locked --release
      - name: Test native app with synthetic providers
        if: matrix.rust == 'stable'
        run: swift test --package-path macos
      - name: Build native CLI without account access
        if: matrix.rust == 'stable'
        run: ./script/build_cli.sh && ./dist/codex-devices-mac --help
      - name: Build native app bundle without launching
        if: matrix.rust == 'stable'
        run: ./script/build_and_run.sh --build-only

  advisories:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install audit toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install pinned advisory checker
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo +stable audit --deny warnings
