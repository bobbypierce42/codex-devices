[package]
name = "codex-devices"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Synthetic Codex device workflows and opt-in Mac sign-in diagnostics"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bobbypierce42/codex-devices"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
